<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Multi-stop Cyber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Violet (Frontend) -->
      <stop offset="50%" stop-color="#0088FF" /> <!-- Blue (Systems) -->
      <stop offset="100%" stop-color="#00F5A0" /> <!-- Neon Green (Backend) -->
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded hexagon or circle for contrast -->
  <rect width="512" height="512" rx="128" fill="#06030D" />
  
  <!-- Sleek gradient ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#cyberGrad)" stroke-width="8" opacity="0.3" />

  <!-- Main Symbol: Glowing Tech/Code Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Hexagonal Node Center -->
    <polygon points="256,90 400,173 400,339 256,422 112,339 112,173" 
             fill="none" 
             stroke="url(#cyberGrad)" 
             stroke-width="16" 
             stroke-linejoin="round" />
             
    <!-- Inner stylized code brackets '<' and '>' -->
    <!-- Left bracket '<' -->
    <path d="M 210,180 L 150,256 L 210,332" 
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right bracket '>' -->
    <path d="M 302,180 L 362,256 L 302,332" 
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Slash/DevOps line / Connection -->
    <path d="M 276,150 L 236,362" 
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="18" 
          stroke-linecap="round" />
  </g>
</svg>
